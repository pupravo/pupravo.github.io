<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Римско право – Речник на основните термини</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <link href="./style.css" rel="stylesheet">
</head>
<body>
<header class="hero">
  <h1>Римско право</h1>
  <div class="sub">Речник на основните термини</div>
</header>
<div class="bar"><div class="bar-in">
  <div class="row">
    <div class="dd"><button class="dd-btn" id="ddb" aria-haspopup="true" aria-expanded="false"><span id="ddl"></span><span class="car">▾</span></button><div class="dd-menu" id="ddm" role="menu"></div></div>
    <input type="search" id="q" placeholder="Търси термин или значение…" aria-label="Търсене" autocomplete="off">
    <span class="count" id="cnt"></span>
    <button class="t" id="theme" title="Тема" aria-label="Смяна на темата">◐</button>
  </div>
  <nav class="az" id="az"></nav>
</div></div>
<main id="list"></main>
<div class="none" id="none">Няма намерени термини.</div>
<footer>Съставено от сканираните страници на речника. Звездичката в оригинала (<i>term*</i>) означава препратка към друг термин.</footer>
<button id="top" aria-label="Нагоре">↑</button>
<script type="text/javascript" src="data.js"></script>
</body>
</html>
