      <!-- CONTENT -->
      <div class="content-row">
        <!-- CALENDAR -->
        <section class="calendar-panel">
          <div class="cal-toolbar">
            <div class="view-toggle" id="viewToggle">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>

              <button class="view-btn" data-view="grid" title="Изглед: календар">

              </button>
            </div>

            <span class="cal-title" id="calTitle"></span>
            <button class="arrow-btn" id="prevBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button class="arrow-btn" id="nextBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>

            <div class="spacer"></div>

            <div class="type-tabs" id="typeTabs"></div>
            <select class="group-select" id="groupSelect"></select>
            <button class="today-btn" id="todayBtn">Днес</button>
          </div>

          <div class="grid-wrap" id="gridWrap">
            <div class="cal-grid" id="calGrid"></div>
          </div>
          <div class="list-wrap" id="listWrap"></div>
        </section>
